<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Proyecto Ahorra: control de finanzas personales.">
  <title>Metas de ahorro | Ahorra</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>

<body class="d-flex flex-column min-vh-100">
  <a class="visually-hidden-focusable" href="#contenido">Saltar al contenido</a>
  <header class="container pt-3">
    <nav class="navegacion-provisional" aria-label="Navegación provisional">
      <a href="index.html"><strong>Ahorra</strong></a>
      <a href="index.html">Inicio</a>
      <a href="ingresos-gastos.html">Ingresos y gastos</a>
      <a href="metas-ahorro.html" aria-current="page">Metas de ahorro</a>
      <a href="estadisticas.html">Estadísticas</a>
    </nav>
  </header>
  <main id="contenido" class="container py-4 flex-grow-1">
    <h1>Metas de ahorro</h1>
    <p class="text-secondary">Aquí se podrán crear y consultar objetivos de ahorro.</p>
    <section aria-labelledby="crear-meta-titulo" class="mb-4">
      <h2 id="crear-meta-titulo" class="h4">Crear una meta</h2>
      <form id="form-meta" class="row g-3">
        <div class="col-12 col-md-6"><label class="form-label" for="nombre-meta">Nombre de la meta</label><input
            id="nombre-meta" name="nombre" class="form-control" type="text" placeholder="Ej.: Comprar notebook"></div>
        <div class="col-12 col-md-3"><label class="form-label" for="objetivo">Monto objetivo</label><input id="objetivo"
            name="objetivo" class="form-control" type="number" min="1"></div>
        <div class="col-12 col-md-3"><label class="form-label" for="acumulado">Ahorro actual</label><input
            id="acumulado" name="acumulado" class="form-control" type="number" min="0"></div>
        <div><button type="button" class="btn btn-primary" disabled>Crear meta (pendiente)</button></div>
      </form>
    </section>
    <section aria-labelledby="lista-metas-titulo">
      <h2 id="lista-metas-titulo" class="h4">Mis metas</h2>
      <p class="border rounded p-4 text-secondary" id="lista-metas">Sin metas creadas todavía.</p>
    </section>
  </main>
  <script src="assets/js/main.js" defer></script>
</body>

</html>
